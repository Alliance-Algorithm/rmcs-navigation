# 全局地图 + 全局规划
global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: world
      robot_base_frame: base_link
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: "/map"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.8

planner_server:
  ros__parameters:
    planner_plugins: ["global_planner"]
    global_planner:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      use_astar: false
      allow_unknown: true

# 局部地图 + 局部规划
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["local_planner"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::PositionGoalChecker"
      xy_goal_tolerance: 0.2

    local_planner:
      plugin: "dwb_core::DWBLocalPlanner"
      critics: ["BaseObstacle", "PathDist", "GoalDist"]
      max_vel_x: 5.0
      max_accel_x: 20.0
      BaseObstacle.scale: 2.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: world
      robot_base_frame: base_link
      rolling_window: true
      width: 16
      height: 16
      resolution: 0.04
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: "/local_map"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.2

# 末端速度优化
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 40.0
    max_velocity: [3.5, 3.5, 3.0]
    max_accel: [+8.0, +30.0, +30.0]
    max_decel: [-8.0, -30.0, -30.0]
    odom_topic: /aft_mapped_to_init
