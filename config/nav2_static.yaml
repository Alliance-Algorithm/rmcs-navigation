bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: world
    robot_base_frame: odin1_chassis_link
    odom_topic: /odin1/odometry
    bt_loop_duration: 10
    default_server_timeout: 120
    enable_groot_monitoring: false

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    use_sim_time: true
    costmap_update_timeout: 2.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [position_goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.2
      movement_time_allowance: 10.0

    position_goal_checker:
      stateful: true
      plugin: nav2_controller::PositionGoalChecker
      xy_goal_tolerance: 0.20

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: False

      max_vel_x: +5.0
      min_vel_x: -5.0
      max_vel_y: +5.0
      min_vel_y: -5.0

      max_vel_theta: +1.0
      min_vel_theta: -1.0

      min_speed_xy: 0.0
      max_speed_xy: 8.0
      min_speed_theta: 0.0
      max_speed_theta: 3.0

      acc_lim_x: +20.0
      decel_lim_x: -20.0
      acc_lim_y: +20.0
      decel_lim_y: -20.0
      acc_lim_theta: +3.0
      decel_lim_theta: -3.0

      vx_samples: 8
      vy_samples: 8
      vtheta_samples: 0

      sim_time: 1.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      xy_goal_tolerance: 0.25
      path_length_tolerance: 1.0
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: False
      limit_vel_cmd_in_traj: False
      stateful: True
      critics: ["Oscillation", "GoalAlign", "PathAlign", "PathDist", "GoalDist", "Twirling"]
      GoalAlign.scale: 4.0
      GoalAlign.forward_point_distance: 0.1
      PathAlign.scale: 12.0
      PathAlign.forward_point_distance: 0.1
      PathDist.scale: 12.0
      GoalDist.scale: 10.0
      Twirling.scale: 12.0

local_costmap:
  local_costmap:
    ros__parameters:
      initial_transform_timeout: 120.0
      use_sim_time: true
      robot_radius: 0.2
      global_frame: world
      robot_base_frame: odin1_chassis_link
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.08
      transform_tolerance: 0.2
      always_send_full_costmap: false
      update_frequency: 5.0
      publish_frequency: 1.0
      track_unknown_space: false
      plugins: [static_layer]

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /local_map
        map_subscribe_transient_local: true
        subscribe_to_updates: true
        use_maximum: true
        track_unknown_space: false
        lethal_cost_threshold: 90

global_costmap:
  global_costmap:
    ros__parameters:
      initial_transform_timeout: 120.0
      use_sim_time: true
      robot_radius: 0.2
      global_frame: world
      robot_base_frame: odin1_chassis_link
      rolling_window: false
      resolution: 0.1
      transform_tolerance: 0.5
      always_send_full_costmap: true
      track_unknown_space: false
      update_frequency: 5.0
      publish_frequency: 1.0
      plugins: [static_layer]

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: true
        use_maximum: true
        track_unknown_space: false
        lethal_cost_threshold: 90

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 10.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    global_frame: world
    local_frame: world
    robot_base_frame: odin1_chassis_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 30.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [+3.5, +3.5, +3.0]
    min_velocity: [-3.5, -3.5, -3.0]
    max_accel: [+8.0, +30.0, +10.0]
    max_decel: [-8.0, -30.0, -10.0]
    odom_topic: /odin1/odometry
    odom_duration: 0.1
    deadband_velocity: [0.02, 0.02, 0.02]
    velocity_timeout: 1.0

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
